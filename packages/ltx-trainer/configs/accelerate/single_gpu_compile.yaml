# Single GPU + torch.compile (Inductor).
# dynamo_use_dynamic: true -> one compiled graph serves several sequence lengths,
# which is what a mixed-bucket dataset (81 and 41 frames) needs.
compute_environment: LOCAL_MACHINE
dynamo_config:
  dynamo_backend: INDUCTOR
  dynamo_mode: default
  dynamo_use_fullgraph: false
  dynamo_use_dynamic: true
debug: false
distributed_type: 'NO'
downcast_bf16: 'no'
enable_cpu_affinity: false
machine_rank: 0
main_training_function: main
mixed_precision: bf16
num_machines: 1
num_processes: 1
rdzv_backend: static
same_network: true
tpu_env: []
tpu_use_cluster: false
tpu_use_sudo: false
use_cpu: false
